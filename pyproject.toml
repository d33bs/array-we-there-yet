[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=64", "setuptools-scm>=8" ]

[project]
name = "array-we-there-yet"
description = "Benchmarks for wide tables and fixed-size array layouts for high-dimensional profiles."
readme = "README.md"
authors = [
  { name = "d33bs" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "duckdb>=1.5.5",
  "fire>=0.7",
  "jinja2>=3.1.6",
  "markdown-it-py>=3",
  "numpy>=2.2.6",
  "pandas>=2.2.3",
  "pyarrow>=25.0.1",
  "pylance>=12",
  "tabulate>=0.9",
  "tiledb>=0.36.1",
  "vortex-data>=0.86.1",
  "zarr<3",
]
scripts.array-we-there-yet = "array_we_there_yet.cli:trigger"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10.6",
  "poethepoet>=0.34",
  "pre-commit>=4.6.2",
  "pytest>=8.3.5",
  "pytest-cov>=6.2.1",
]
notebooks = [
  "black>=25.1",
  "isort>=6.0.1",
  "jupyterlab>=4.4.2",
  "jupyterlab-code-formatter>=3.0.2",
  "jupytext>=1.17.1",
]

[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.include = [ "array_we_there_yet*" ]
package-dir = { "" = "src" }
include-package-data = true
package-data.array_we_there_yet = [ "content/*.md", "site/*" ]

[tool.setuptools_scm]
version_file = "src/array_we_there_yet/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
root = "."

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `F401` (unused imports) for `__init__.py` file
lint.per-file-ignores."__init__.py" = [ "F401" ]
lint.per-file-ignores."src/array_we_there_yet/benchmark.py" = [ "PLR0913" ]
lint.per-file-ignores."src/array_we_there_yet/cli.py" = [ "PLR0913", "PLR0917" ]
lint.per-file-ignores."src/array_we_there_yet/main.py" = [ "PLR0913" ]

[tool.vulture]
paths = [ "src/array_we_there_yet", "tests" ]
min_confidence = 90

[tool.pytest]
ini_options.pythonpath = [ "." ]
ini_options.addopts = [
  "--cov=array_we_there_yet",
  "--cov-report=term-missing",
  "--cov-report=xml",
]

[tool.coverage]
run.source = [ "src/array_we_there_yet" ]
run.branch = true
report.skip_covered = true
report.show_missing = true

[tool.poe]
# tasks for development environments
tasks.test.shell = """
pytest
"""
tasks.lint.shell = """
pre-commit run --all-files
"""
tasks.pipeline.shell = """
pre-commit run --all-files && pytest
"""
tasks.jupyter.shell = """
jupyter lab
"""

[tool.jupytext]
formats = "ipynb,py:light"
